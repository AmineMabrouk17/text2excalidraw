  </g>

  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2430">Text2<tspan fill="#6965db">Excalidraw</tspan></text>
