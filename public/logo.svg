<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Text2Excalidraw — from prompt to diagram">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5a0ff"/>
      <stop offset="100%" stop-color="#8b87ff"/>
    </linearGradient>
  </defs>

  <!-- badge + simple diagram glyph -->
  <g transform="translate(8,20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#badge)"/>
    <circle cx="24" cy="34" r="9" fill="#ffffff"/>
    <rect x="46" y="46" width="22" height="16" rx="4" fill="#ffffff"/>
    <path d="M33 40 L48 52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="104" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#44507a">Text2<tspan fill="#8b87ff">Excalidraw</tspan></text>
</svg>
